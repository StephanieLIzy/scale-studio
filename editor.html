<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGI Bar 空间预演 · 编辑器</title>
  <link rel="stylesheet" href="styles.css?v=20260814-4">
</head>
<body>
  <div class="app hidden" id="app">
    <header class="topbar">
      <div class="editor-brand">
        <img src="assets/agi-bar-logo.png" alt="AGI Bar">
        <span class="editor-brand-copy">
          <strong>空间预演</strong>
          <small id="canvasSummary">自由画布</small>
        </span>
      </div>
      <span class="save-status" id="projectHomeStatus" aria-live="polite">自动保存</span>
      <div class="toolbar">
        <div class="toolbar-group editor-tools">
          <div class="menu-wrap">
          <button class="toolbar-action" id="canvasSettingsBtn" type="button" aria-haspopup="true" aria-expanded="false" title="画布设置">
            <span class="button-label">画布设置</span>
          </button>
          <div class="export-menu canvas-settings-menu" id="canvasSettingsMenu">
            <div class="menu-heading">
              <strong>画布基础</strong>
              <span>尺寸、网格与背景</span>
            </div>
            <div class="fields">
              <label>宽 mm<input id="canvasW" type="number" min="100" value="4800"></label>
              <label>高 mm<input id="canvasH" type="number" min="100" value="2700"></label>
              <label>等比分割<input id="divisions" type="number" min="1" max="24" value="4"></label>
              <label>网格间距 mm<input id="gridStep" type="number" min="5" value="100"></label>
            </div>
            <div class="settings-row">
              <span>画布类型</span>
              <div class="segmented" aria-label="画布类型">
                <button id="gridModeBtn" class="active" type="button">网格</button>
                <button id="solidModeBtn" type="button">纯色</button>
              </div>
            </div>
            <div class="settings-row">
              <span>背景颜色</span>
              <div class="segmented" aria-label="背景颜色">
                <button id="whiteBgBtn" class="active" type="button">白色</button>
                <button id="blackBgBtn" type="button">黑色</button>
              </div>
            </div>
            <div class="settings-row zoom-setting">
              <label>缩放<input id="zoom" type="range" min="5" max="200" value="20"></label>
              <input id="zoomReadout" readonly value="20%" aria-label="当前缩放比例">
            </div>
          </div>
          </div>
          <div class="menu-wrap">
          <button class="primary toolbar-action" id="uploadMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="上传">
            <span class="button-icon" aria-hidden="true">↑</span>
            <span class="button-label">上传</span>
          </button>
          <div class="export-menu" id="uploadMenu">
            <button id="uploadImagesBtn" type="button">上传图片</button>
            <button id="loadProjectBtn" type="button">导入项目 JSON</button>
          </div>
          </div>
          <div class="menu-wrap">
          <button class="toolbar-action" id="exportMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="导出">
            <span class="button-icon" aria-hidden="true">↓</span>
            <span class="button-label">导出</span>
          </button>
          <div class="export-menu" id="exportMenu">
            <button id="exportPngBtn" type="button">导出预览 PNG</button>
            <button id="exportCsvBtn" type="button">导出尺寸 CSV</button>
            <div class="menu-separator"></div>
            <button id="saveProjectBtn" type="button">保存项目 JSON</button>
          </div>
          </div>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="toolbar-action back-action" id="backProjectsBtn" type="button" title="返回我的项目">
          <span class="button-icon" aria-hidden="true">←</span>
          <span class="button-label">我的项目</span>
        </button>
      </div>
    </header>

    <main class="canvas-viewport">
      <div class="segmented canvas-view-switch" id="templateViewSwitch" aria-label="店内模板视图">
        <button id="outlineViewBtn" class="active" type="button">轮廓预览</button>
        <button id="photoViewBtn" type="button">实景预览</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="stage-shell" id="stageShell">
          <div class="stage-frame" id="stageFrame">
            <div class="ruler-top" id="rulerTop"></div>
            <div class="ruler-left" id="rulerLeft"></div>
            <div class="stage" id="stage"></div>
          </div>
        </div>
      </div>
    </main>

    <aside class="side right" id="logoPanel">
      <div class="side-head">
        <button class="icon panel-toggle" id="toggleRightBtn" title="收起物料属性" aria-controls="logoPanel" type="button">›</button>
        <span>物料属性</span>
      </div>
      <div class="side-content">
        <section class="section">
          <h2>选中物料</h2>
          <div id="selectedPanel" class="selected-empty">选择一个物料后，可以在这里精确调整实际尺寸和位置。</div>
        </section>
        <section class="section">
          <h2>物料列表</h2>
          <div class="logo-list" id="logoList"></div>
        </section>
      </div>
    </aside>
  </div>

  <input class="hidden-input" id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple>
  <input class="hidden-input" id="jsonInput" type="file" accept="application/json">
  <script src="app.js?v=20260814-4"></script>
</body>
</html>
